services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: migration_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: migration_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_demo -d migration_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://migration_demo:local_demo_only@db:5432/migration_demo
      DEMO_CONTROLS_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/demo/status')"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:

