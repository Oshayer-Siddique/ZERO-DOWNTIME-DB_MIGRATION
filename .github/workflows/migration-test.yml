name: Migration compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker compose build api
      - name: Check generated compatibility SQL
        run: docker compose run --rm --no-deps api python -m scripts.check_migration_sql --generate
      - name: Start temporary PostgreSQL
        run: docker compose up -d --wait db
      - name: Run PostgreSQL lifecycle, API, and safety tests
        run: docker compose run --rm api python -m pytest -q
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove temporary environment
        if: always()
        run: docker compose down --volumes --remove-orphans
